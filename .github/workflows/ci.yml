name: Linting & Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  PISCES_CHROMEDP_REMOTE_URL: "http://localhost:9222"

jobs:
  test:
    strategy:
      matrix:
        go-version: ['1.27']
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Start headless Chrome
      run: |
        docker run -d \
          --name chromedp \
          --network host \
          chromedp/headless-shell:latest
        if ! curl --retry 30 --retry-delay 1 --retry-all-errors --max-time 2 -fsS http://localhost:9222/json/version > /dev/null; then
          docker logs chromedp
          exit 1
        fi

    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Disable AppArmor unprivileged userns restriction
      run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      if: runner.os == 'Linux'

    - name: Run go fmt check
      run: |
        if [ -n "$(gofmt -l .)" ]; then
        echo "Go files are not formatted. Run 'gofmt -w .' to fix them."
          exit 1
        fi

    - name: Run linting
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.15.0

    - name: Run tests
      run: go test ./...
